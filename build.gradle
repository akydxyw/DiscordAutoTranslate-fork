// AGP 9.4.x 是当前能支持 compileSdk 37 的稳定版本。
// 依据官方兼容表：AGP 9.4 需要 Gradle >= 9.6.0、JDK 17、Build Tools 36.0.0。
// 说明：自 AGP 9.0 起 Kotlin 编译由 AGP 内置（built-in Kotlin），不能再 apply
// org.jetbrains.kotlin.android；这里用 buildscript classpath 把内置 Kotlin 升级到
// 2.4.21，以匹配 miuix 0.9.4 传递依赖的 kotlin-stdlib 2.4.x 元数据版本。
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
    }
}

plugins {
    id "com.android.application" version "9.4.1" apply false
    // Compose 编译器插件：AGP 的内置 Kotlin 不会自动启用 Compose，需要单独 apply。
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.21" apply false
}
